<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHAOS PROJECT — Jevil Boss Fight Recreation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app-root">
    <div id="stage-shell" class="scale-fit">
      <canvas id="game-canvas" width="640" height="480" tabindex="0"></canvas>
      <div id="crt-overlay" class="hidden"></div>

      <!-- Subtle in-game HUD bar for quick mouse access -->
      <div id="top-controls" class="hidden">
        <button id="btn-pause" class="hud-pill" title="Pause (Esc)">PAUSE</button>
        <button id="btn-mute" class="hud-pill" title="Toggle Mute">AUDIO: ON</button>
        <button id="btn-fullscreen" class="hud-pill" title="Fullscreen">FULL</button>
      </div>

      <!-- Modal Overlay Container (Mode Select, Settings, Credits, Pause) -->
      <div id="overlay-backdrop" class="hidden">
        <div id="overlay-panel" class="dr-box"></div>
      </div>

      <!-- Click-to-start Audio Unlock prompt if autoplay blocked -->
      <div id="audio-toast" class="hidden">Press any key or click to enable audio</div>
    </div>
  </div>

  <script type="module" src="src/main.js?v=2"></script>
</body>
</html>
